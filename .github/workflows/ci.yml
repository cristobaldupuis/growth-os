name: CI

# Runs the same four checks as `npm run verify`. They exist as separate steps
# rather than one script call so a failure names itself in the GitHub UI without
# anyone having to open the log.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Colour contrast (WCAG AA)
        # Guards the palette against the specific regression that shipped once:
        # gold text at 2.4:1 on white in light mode.
        run: npm run check:contrast

      - name: Build
        run: npm run build
