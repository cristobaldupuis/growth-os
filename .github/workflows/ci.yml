name: CI

# Runs the same four checks as `npm run verify`. They exist as separate steps
# rather than one script call so a failure names itself in the GitHub UI without
# anyone having to open the log.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Colour contrast (WCAG AA)
        # Guards the palette against the specific regression that shipped once:
        # gold text at 2.4:1 on white in light mode.
        run: npm run check:contrast

      - name: Serverless Function budget
        # Guards the specific failure that shipped once: seven api/*.test.js files
        # were being deployed as functions, which put the count at exactly the
        # Hobby plan's twelve. The next file added broke the deployment — after
        # lint, tests, contrast and build had all passed. Failing here means it is
        # caught in the pull request instead.
        run: npm run check:functions

      - name: Build
        run: npm run build
